description = "Exact transaction-store idempotency fixtures in their test"
condition = "AND"
regexTarget = "line"
paths = [
  '''^tests/sqlite-generation-transaction-store\.test\.ts$''',
  '''^dist/tests/sqlite-generation-transaction-store\.test\.js$''',
  '''^\.публикация/checkout/tests/sqlite-generation-transaction-store\.test\.ts$''',
  '''^\.публикация/checkout/dist/tests/sqlite-generation-transaction-store\.test\.js$'''
