name: Verify

on:
  workflow_dispatch:
    inputs:
      scope:
        description: Checks to run for this manual workflow
        type: choice
        required: true
        default: changed-media
        options:
          - changed-media
          - docs-only
          - media-cli-fix
          - catalog-update
          - media-update
          - full

permissions:
  contents: read

jobs:
  changed-media:
    name: Scoped checks / Linux / Node 24.21.0
    if: inputs.scope == 'changed-media' || inputs.scope == 'docs-only' || inputs.scope == 'media-cli-fix' || inputs.scope == 'catalog-update' || inputs.scope == 'media-update'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout source
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24.21.0
          package-manager-cache: false

      - name: Install locked dependencies
        run: npm ci

      - name: Build
        if: inputs.scope == 'changed-media' || inputs.scope == 'catalog-update' || inputs.scope == 'media-update'
        run: npm run build

      - name: Install media probe tools for changed video checks
        if: inputs.scope == 'changed-media' || inputs.scope == 'media-update'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ffmpeg
          /usr/bin/ffmpeg -version
          /usr/bin/ffprobe -version

      - name: Install pinned Gitleaks for public source checks
        shell: bash
        run: |
          set -euo pipefail
          scanner_dir="$RUNNER_TEMP/syntx-gitleaks-8.30.1"
          mkdir -p "$scanner_dir"
          curl --fail --location --silent --show-error --max-time 90 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            -o "$scanner_dir/gitleaks.tar.gz"
          printf '%s  %s\n' '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb' "$scanner_dir/gitleaks.tar.gz" | sha256sum --check --strict
          tar -xzf "$scanner_dir/gitleaks.tar.gz" -C "$scanner_dir" gitleaks
          "$scanner_dir/gitleaks" version
          printf '%s\n' "$scanner_dir" >> "$GITHUB_PATH"

      - name: Verify changed media coverage
        if: inputs.scope == 'changed-media'
        env:
          SYNTX_HAPPY_HORSE_TEST_FFMPEG: /usr/bin/ffmpeg
          SYNTX_HAPPY_HORSE_TEST_FFPROBE: /usr/bin/ffprobe
          SYNTX_KLING_MEDIA_TEST_FFMPEG: /usr/bin/ffmpeg
          SYNTX_KLING_MEDIA_TEST_FFPROBE: /usr/bin/ffprobe
          SYNTX_ACTTWO_TEST_FFMPEG: /usr/bin/ffmpeg
          SYNTX_ACTTWO_TEST_FFPROBE: /usr/bin/ffprobe
          SYNTX_HEYGEN4_TEST_FFMPEG: /usr/bin/ffmpeg
          SYNTX_HEYGEN4_TEST_FFPROBE: /usr/bin/ffprobe
          SYNTX_SWITCHX_TEST_FFMPEG: /usr/bin/ffmpeg
          SYNTX_SWITCHX_TEST_FFPROBE: /usr/bin/ffprobe
        run: npm run test:media:changed

      - name: Unchanged media checks intentionally skipped for docs-only scope
        if: inputs.scope == 'docs-only'
        run: echo NOT_RUN_UNCHANGED_MEDIA_DOCS_ONLY

      - name: Verify corrected media CLI regression and export guards
        if: inputs.scope == 'media-cli-fix'
        run: |
          node --test tests/print-media-kling-switchx2357.test.mjs
          node --test --test-name-pattern="allowlisted media guides|exports only the exact committed" tests/export-public-snapshot.test.mjs

      - name: Verify public manifest hashes, read safety, and secrets
        # catalog-update has only offline/mock requests; it never starts provider jobs.
        run: node --test tests/public-secret-scan.test.mjs

      - name: Verify catalog update and affected media constraints
        if: inputs.scope == 'catalog-update'
        run: npm run test:catalog:update

      - name: Verify current media, updater, and package changes
        if: inputs.scope == 'media-update'
        env:
          SYNTX_MCV_TEST_FFMPEG: /usr/bin/ffmpeg
          SYNTX_MCV_TEST_FFPROBE: /usr/bin/ffprobe
          SYNTX_KLING_MEDIA_TEST_FFMPEG: /usr/bin/ffmpeg
          SYNTX_KLING_MEDIA_TEST_FFPROBE: /usr/bin/ffprobe
        run: npm run test:media:update

      - name: Prepare npm registry cache for public package consumer
        if: inputs.scope == 'media-update'
        run: npm run package:cache:prime -- --confirm-registry-fetch

      - name: Verify clean public package consumer
        if: inputs.scope == 'media-update'
        run: npm run package:smoke:public

  portability:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    if: inputs.scope == 'full'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22.13.0, 24.21.0]
    steps:
      - name: Checkout source
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false

      - name: Install locked dependencies
        run: npm ci

      - name: Prepare private synthetic test temporary directory
        if: matrix.os == 'ubuntu-latest' && matrix.node == '24.21.0'
        shell: bash
        run: |
          set -euo pipefail
          ci_temp="$HOME/syntx-ci-tmp-${{ github.run_id }}-${{ github.run_attempt }}"
          mkdir -m 700 "$ci_temp"
          printf 'TMPDIR=%s\n' "$ci_temp" >> "$GITHUB_ENV"

      - name: Install pinned Gitleaks for the full synthetic suite
        if: matrix.os == 'ubuntu-latest' && matrix.node == '24.21.0'
        shell: bash
        run: |
          set -euo pipefail
          scanner_dir="$RUNNER_TEMP/syntx-gitleaks-8.30.1"
          mkdir -p "$scanner_dir"
          curl --fail --location --silent --show-error --max-time 90 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            -o "$scanner_dir/gitleaks.tar.gz"
          printf '%s  %s\n' '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb' "$scanner_dir/gitleaks.tar.gz" | sha256sum --check --strict
          tar -xzf "$scanner_dir/gitleaks.tar.gz" -C "$scanner_dir" gitleaks
          "$scanner_dir/gitleaks" version
          printf '%s\n' "$scanner_dir" >> "$GITHUB_PATH"

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Media config helper smoke test
        run: node --test tests/print-media-mcp-config.test.mjs

      - name: Full synthetic suite (Ubuntu / Node 24.21.0)
        if: matrix.os == 'ubuntu-latest' && matrix.node == '24.21.0'
        run: npm test

      - name: Prepare npm registry cache (no provider access)
        if: matrix.os == 'ubuntu-latest' && matrix.node == '24.21.0'
        run: npm run package:cache:prime -- --confirm-registry-fetch

      - name: Public clean package and installed SDK checks (offline)
        if: matrix.os == 'ubuntu-latest' && matrix.node == '24.21.0'
        run: npm run package:smoke:public
