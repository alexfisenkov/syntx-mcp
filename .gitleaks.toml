  '''\bidempotency_key\s*:\s*["\x27]\x63\x61\x6e\x63\x65\x6c\x5f\x69\x64\x65\x6d\x5f\x30\x31\x32["\x27]''',
  '''\bidempotency_key\s*:\s*["\x27]\x6f\x77\x6e\x65\x72\x2d\x75\x6e\x63\x61\x70\x70\x65\x64\x2d\x69\x64\x65\x6d\x2d\x30\x30\x30\x31["\x27]'''
