name: Verify

on:
  workflow_dispatch:
    inputs:
      scope:
        description: Checks to run for this manual workflow
        type: choice
        required: true
        default: changed-media
        options:
          - changed-media
          - docs-only
          - media-cli-fix
          - image-file-fix
          - catalog-update
          - media-update
          - media-cloud-final
          - windows-native-fix
          - windows-acl-perf
          - https-deploy-fix
          - https-runtime-fix
          - schema-import-fix
          - full

permissions:
  contents: read

jobs:
  changed-media:
    name: Scoped checks / Ubuntu 24.04 / Node 24.21.0
    if: inputs.scope == 'changed-media' || inputs.scope == 'docs-only' || inputs.scope == 'media-cli-fix' || inputs.scope == 'image-file-fix' || inputs.scope == 'catalog-update' || inputs.scope == 'media-update' || inputs.scope == 'media-cloud-final' || inputs.scope == 'https-deploy-fix' || inputs.scope == 'https-runtime-fix' || inputs.scope == 'schema-import-fix'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout source
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24.21.0
          package-manager-cache: false

      - name: Install locked dependencies
        run: npm ci

      - name: Audit runtime dependencies for the HTTPS release
        if: inputs.scope == 'media-cloud-final'
        run: npm audit --omit=dev --audit-level=high

      - name: Build
        if: inputs.scope == 'changed-media' || inputs.scope == 'image-file-fix' || inputs.scope == 'catalog-update' || inputs.scope == 'media-update' || inputs.scope == 'media-cloud-final' || inputs.scope == 'https-runtime-fix' || inputs.scope == 'schema-import-fix'
        run: npm run build

      - name: Verify remote owner Unicode filename and HTTPS startup regressions
        if: inputs.scope == 'schema-import-fix'
        run: node --test --test-concurrency=1 dist/tests/remote-owner-schema-unicode-filename.test.js dist/tests/remote-owner-https-startup.test.js

      - name: Install media probe tools for changed video checks
        if: inputs.scope == 'changed-media' || inputs.scope == 'media-update' || inputs.scope == 'image-file-fix' || inputs.scope == 'media-cloud-final'
        shell: bash
        run: |
          set -euo pipefail
          if [[ -x /usr/bin/ffmpeg && -x /usr/bin/ffprobe ]]; then
            /usr/bin/ffmpeg -version
            /usr/bin/ffprobe -version
            exit 0
          fi
          sudo env DEBIAN_FRONTEND=noninteractive timeout 180s apt-get \
            -o Acquire::Retries=1 \
            -o Acquire::http::Timeout=20 \
            -o Acquire::https::Timeout=20 \
            update
          sudo env DEBIAN_FRONTEND=noninteractive timeout 600s apt-get \
            -o Acquire::Retries=1 \
            -o Acquire::http::Timeout=20 \
            -o Acquire::https::Timeout=20 \
            install --yes --no-install-recommends ffmpeg
          test -x /usr/bin/ffmpeg
          test -x /usr/bin/ffprobe
          /usr/bin/ffmpeg -version
          /usr/bin/ffprobe -version

      - name: Install pinned Gitleaks for public source checks
        shell: bash
        run: |
          set -euo pipefail
          scanner_dir="$RUNNER_TEMP/syntx-gitleaks-8.30.1"
          mkdir -p "$scanner_dir"
          curl --fail --location --silent --show-error --max-time 90 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            -o "$scanner_dir/gitleaks.tar.gz"
          printf '%s  %s\n' '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb' "$scanner_dir/gitleaks.tar.gz" | sha256sum --check --strict
          tar -xzf "$scanner_dir/gitleaks.tar.gz" -C "$scanner_dir" gitleaks
          "$scanner_dir/gitleaks" version
          printf '%s\n' "$scanner_dir" >> "$GITHUB_PATH"

      - name: Verify changed media coverage
        if: inputs.scope == 'changed-media'
        env:
          SYNTX_HAPPY_HORSE_TEST_FFMPEG: /usr/bin/ffmpeg
          SYNTX_HAPPY_HORSE_TEST_FFPROBE: /usr/bin/ffprobe
          SYNTX_KLING_MEDIA_TEST_FFMPEG: /usr/bin/ffmpeg
          SYNTX_KLING_MEDIA_TEST_FFPROBE: /usr/bin/ffprobe
          SYNTX_ACTTWO_TEST_FFMPEG: /usr/bin/ffmpeg
          SYNTX_ACTTWO_TEST_FFPROBE: /usr/bin/ffprobe
          SYNTX_HEYGEN4_TEST_FFMPEG: /usr/bin/ffmpeg
          SYNTX_HEYGEN4_TEST_FFPROBE: /usr/bin/ffprobe
          SYNTX_SWITCHX_TEST_FFMPEG: /usr/bin/ffmpeg
          SYNTX_SWITCHX_TEST_FFPROBE: /usr/bin/ffprobe
        run: npm run test:media:changed

      - name: Unchanged media checks intentionally skipped for docs-only scope
        if: inputs.scope == 'docs-only'
        run: echo NOT_RUN_UNCHANGED_MEDIA_DOCS_ONLY

      - name: Verify corrected media CLI regression and export guards
        if: inputs.scope == 'media-cli-fix'
        run: |
          node --test tests/print-media-kling-switchx2357.test.mjs
          node --test --test-name-pattern="allowlisted media guides|exports only the exact committed" tests/export-public-snapshot.test.mjs

      # Linux scope installs ffmpeg and runs the real JPEG preparation/decode suite.
      - name: Verify ChatGPT image-file input, local image import, and real Linux JPEG preparation
        if: inputs.scope == 'image-file-fix'
        env:
          SYNTX_MEDIA_FFMPEG_PATH: /usr/bin/ffmpeg
          SYNTX_MEDIA_FFPROBE_PATH: /usr/bin/ffprobe
        run: npm run test:image:file-fix

      - name: Verify public manifest hashes, read safety, and secrets
        # catalog-update has only offline/mock requests; it never starts provider jobs.
        run: node --test tests/public-secret-scan.test.mjs

      - name: Verify catalog update and affected media constraints
        if: inputs.scope == 'catalog-update'
        run: npm run test:catalog:update

      - name: Verify current media, updater, and package changes
        if: inputs.scope == 'media-update' || inputs.scope == 'media-cloud-final'
        env:
          SYNTX_MEDIA_FFMPEG_PATH: /usr/bin/ffmpeg
          SYNTX_MEDIA_FFPROBE_PATH: /usr/bin/ffprobe
          SYNTX_SUNO_TEST_FFPROBE: /usr/bin/ffprobe
          SYNTX_MCV_TEST_FFMPEG: /usr/bin/ffmpeg
          SYNTX_MCV_TEST_FFPROBE: /usr/bin/ffprobe
          SYNTX_KLING_MEDIA_TEST_FFMPEG: /usr/bin/ffmpeg
          SYNTX_KLING_MEDIA_TEST_FFPROBE: /usr/bin/ffprobe
          SYNTX_ACTTWO_TEST_FFMPEG: /usr/bin/ffmpeg
          SYNTX_ACTTWO_TEST_FFPROBE: /usr/bin/ffprobe
          SYNTX_ELEVENLABS_STS_TEST_FFMPEG: /usr/bin/ffmpeg
          SYNTX_ELEVENLABS_STS_TEST_FFPROBE: /usr/bin/ffprobe
          SYNTX_VIDEO2AUDIO_TEST_FFMPEG: /usr/bin/ffmpeg
          SYNTX_VIDEO2AUDIO_TEST_FFPROBE: /usr/bin/ffprobe
          SYNTX_CURRENT_VIDEO_TEST_FFMPEG: /usr/bin/ffmpeg
          SYNTX_CURRENT_VIDEO_TEST_FFPROBE: /usr/bin/ffprobe
          SYNTX_HAPPY_HORSE_TEST_FFMPEG: /usr/bin/ffmpeg
          SYNTX_HAPPY_HORSE_TEST_FFPROBE: /usr/bin/ffprobe
          SYNTX_HEYGEN4_TEST_FFMPEG: /usr/bin/ffmpeg
          SYNTX_HEYGEN4_TEST_FFPROBE: /usr/bin/ffprobe
          SYNTX_SWITCHX_TEST_FFMPEG: /usr/bin/ffmpeg
          SYNTX_SWITCHX_TEST_FFPROBE: /usr/bin/ffprobe
        run: npm run test:media:update

      - name: Verify isolated HTTPS deployment repair
        if: inputs.scope == 'https-deploy-fix'
        run: node --test deploy/private-owner.test.mjs deploy/private-owner-health-readiness.test.mjs

      - name: Verify HTTPS lifecycle and readonly descriptor contracts
        if: inputs.scope == 'https-runtime-fix'
        run: |
          node --test --test-concurrency=1 tests/remote-owner-https-lifecycle.test.mjs dist/tests/remote-owner-oauth.test.js
          node --test --test-concurrency=1 --test-name-pattern='MCP media coverage tool|Keyframes readonly parameters getter' dist/tests/media-coverage.test.js dist/tests/owner-kling-keyframes-generation-mcp-runtime-1596.test.js

  windows-native-media:
    name: Native media acceptance / Windows 2025 / Node 24.21.0
    if: inputs.scope == 'media-cloud-final' || inputs.scope == 'windows-native-fix' || inputs.scope == 'windows-acl-perf'
    runs-on: windows-2025
    timeout-minutes: 25
    defaults:
      run:
        working-directory: syntx Windows
        shell: pwsh
    steps:
      - name: Checkout clean public source in a path with spaces
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
          path: syntx Windows

      - name: Set up pinned Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24.21.0
          package-manager-cache: false

      - name: Install locked public dependencies and build
        run: |
          npm ci
          if ($LASTEXITCODE -ne 0) { throw 'npm ci failed' }
          npm run build
          if ($LASTEXITCODE -ne 0) { throw 'public source build failed' }

      - name: Install SHA256-pinned real FFmpeg and FFprobe executables
        # FFmpeg links Gyan as a Windows build provider; builder checksum:
        # https://www.gyan.dev/ffmpeg/builds/packages/ffmpeg-9.0.2-essentials_build.zip.sha256
        run: |
          $ErrorActionPreference = 'Stop'
          $mediaRoot = Join-Path $env:RUNNER_TEMP ('syntx media кодеки 🎞 ' + [Guid]::NewGuid().ToString('N'))
          New-Item -ItemType Directory -Path $mediaRoot -ErrorAction Stop | Out-Null
          if (@(Get-ChildItem -LiteralPath $mediaRoot -Force).Count -ne 0) { throw 'codec stage must be newly empty' }
          # Protect the NEW directory before archive/binaries exist. Never rewrite an existing codec ACL.
          $currentSid = [System.Security.Principal.WindowsIdentity]::GetCurrent().User.Value
          $acl = Get-Acl -LiteralPath $mediaRoot
          $acl.SetAccessRuleProtection($true, $false)
          foreach ($rule in @($acl.GetAccessRules($true, $true, [System.Security.Principal.SecurityIdentifier]))) {
            [void]$acl.RemoveAccessRuleSpecific($rule)
          }
          foreach ($sidValue in @($currentSid, 'S-1-5-18', 'S-1-5-32-544')) {
            $sid = [System.Security.Principal.SecurityIdentifier]::new($sidValue)
            $acl.AddAccessRule([System.Security.AccessControl.FileSystemAccessRule]::new($sid,
              [System.Security.AccessControl.FileSystemRights]::FullControl,
              ([System.Security.AccessControl.InheritanceFlags]::ContainerInherit -bor [System.Security.AccessControl.InheritanceFlags]::ObjectInherit),
              [System.Security.AccessControl.PropagationFlags]::None, [System.Security.AccessControl.AccessControlType]::Allow))
          }
          Set-Acl -LiteralPath $mediaRoot -AclObject $acl
          if (!(Get-Acl -LiteralPath $mediaRoot).AreAccessRulesProtected) { throw 'codec stage DACL is not protected' }
          $archive = Join-Path $mediaRoot 'ffmpeg-9.0.2.zip'
          Invoke-WebRequest -Uri 'https://www.gyan.dev/ffmpeg/builds/packages/ffmpeg-9.0.2-essentials_build.zip' -OutFile $archive -TimeoutSec 180
          $expectedHash = '60f467265b1e312373dbcd92200c2618a74850f98d3d078e94296bb3fa2047ba'
          if ((Get-FileHash -Algorithm SHA256 $archive).Hash.ToLowerInvariant() -ne $expectedHash) { throw 'FFmpeg archive SHA256 mismatch' }
          Expand-Archive -LiteralPath $archive -DestinationPath $mediaRoot
          $codecRoot = Join-Path $mediaRoot 'ffmpeg-9.0.2-essentials_build/bin'
          $ffmpegPath = Join-Path $codecRoot 'ffmpeg.exe'
          $ffprobePath = Join-Path $codecRoot 'ffprobe.exe'
          if (!(Test-Path -LiteralPath $ffmpegPath -PathType Leaf) -or !(Test-Path -LiteralPath $ffprobePath -PathType Leaf)) { throw 'real codec executables missing' }
          "SYNTX_MEDIA_FFMPEG_PATH=$ffmpegPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "SYNTX_MEDIA_FFPROBE_PATH=$ffprobePath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Compare bounded native Windows ACL startup
        if: inputs.scope == 'windows-acl-perf'
        run: node scripts/check-windows-acl-performance.mjs

      - name: Verify real Windows stdio, native codecs, Unicode files and mocked media lifecycles
        if: inputs.scope != 'windows-acl-perf'
        run: node scripts/check-windows-media-acceptance.mjs

  local-image-file-portability:
    name: Local file paths only / ${{ matrix.os }} / Node 24.21.0
    if: inputs.scope == 'image-file-fix'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - name: Checkout source
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24.21.0
          package-manager-cache: false

      - name: Install locked dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Verify local path/import behavior on macOS and Windows
        run: node --test dist/tests/owner-local-image-file-service.test.js dist/tests/owner-local-image-file-tool.test.js

      - name: Verify repeatable native absolute roots in the config printer
        run: node --test --test-name-pattern="repeatable absolute local image roots" tests/print-media-mcp-config.test.mjs

      - name: Verify preparation refusal and input preservation without codec acceptance claims
        run: node --test --test-name-pattern="preserves valid in-limit|rejects unrecognized binary|oversize image requires|abort is reported" dist/tests/standard-image-reference-preparation.test.js

  portability:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    if: inputs.scope == 'full'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22.13.0, 24.21.0]
    steps:
      - name: Checkout source
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false

      - name: Install locked dependencies
        run: npm ci

      - name: Prepare private synthetic test temporary directory
        if: matrix.os == 'ubuntu-latest' && matrix.node == '24.21.0'
        shell: bash
        run: |
          set -euo pipefail
          ci_temp="$HOME/syntx-ci-tmp-${{ github.run_id }}-${{ github.run_attempt }}"
          mkdir -m 700 "$ci_temp"
          printf 'TMPDIR=%s\n' "$ci_temp" >> "$GITHUB_ENV"

      - name: Install pinned Gitleaks for the full synthetic suite
        if: matrix.os == 'ubuntu-latest' && matrix.node == '24.21.0'
        shell: bash
        run: |
          set -euo pipefail
          scanner_dir="$RUNNER_TEMP/syntx-gitleaks-8.30.1"
          mkdir -p "$scanner_dir"
          curl --fail --location --silent --show-error --max-time 90 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            -o "$scanner_dir/gitleaks.tar.gz"
          printf '%s  %s\n' '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb' "$scanner_dir/gitleaks.tar.gz" | sha256sum --check --strict
          tar -xzf "$scanner_dir/gitleaks.tar.gz" -C "$scanner_dir" gitleaks
          "$scanner_dir/gitleaks" version
          printf '%s\n' "$scanner_dir" >> "$GITHUB_PATH"

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Media config helper smoke test
        run: node --test tests/print-media-mcp-config.test.mjs

      - name: Full synthetic suite (Ubuntu / Node 24.21.0)
        if: matrix.os == 'ubuntu-latest' && matrix.node == '24.21.0'
        run: npm test

      - name: Prepare npm registry cache (no provider access)
        if: matrix.os == 'ubuntu-latest' && matrix.node == '24.21.0'
        run: npm run package:cache:prime -- --confirm-registry-fetch

      - name: Public clean package and installed SDK checks (offline)
        if: matrix.os == 'ubuntu-latest' && matrix.node == '24.21.0'
        run: npm run package:smoke:public
