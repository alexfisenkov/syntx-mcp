name: Verify

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portability:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22.13.0, 24.21.0]
    steps:
      - name: Checkout source
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false

      - name: Install locked dependencies
        run: npm ci

      - name: Install pinned Gitleaks for the full synthetic suite
        if: matrix.os == 'ubuntu-latest' && matrix.node == '24.21.0'
        shell: bash
        run: |
          set -euo pipefail
          scanner_dir="$RUNNER_TEMP/syntx-gitleaks-8.30.1"
          mkdir -p "$scanner_dir"
          curl --fail --location --silent --show-error --max-time 90 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            -o "$scanner_dir/gitleaks.tar.gz"
          printf '%s  %s\n' '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb' "$scanner_dir/gitleaks.tar.gz" | sha256sum --check --strict
          tar -xzf "$scanner_dir/gitleaks.tar.gz" -C "$scanner_dir" gitleaks
          "$scanner_dir/gitleaks" version
          printf '%s\n' "$scanner_dir" >> "$GITHUB_PATH"

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Media config helper smoke test
        run: node --test tests/print-media-mcp-config.test.mjs

      - name: Full synthetic suite (Ubuntu / Node 24.21.0)
        if: matrix.os == 'ubuntu-latest' && matrix.node == '24.21.0'
        run: npm test

      - name: Public clean package and installed SDK checks
        if: matrix.os == 'ubuntu-latest' && matrix.node == '24.21.0'
        run: npm run package:smoke:public
