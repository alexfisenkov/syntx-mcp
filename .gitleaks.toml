regexes = [
  '''\bidempotency_key\s*:\s*["\x27]\x69\x64\x65\x6d\x70\x6f\x74\x65\x6e\x63\x79\x5f\x6f\x70\x61\x71\x75\x65\x5f\x30\x30\x32["\x27]''',
  '''\bidempotency_key\s*:\s*["\x27]\x69\x64\x65\x6d\x70\x6f\x74\x65\x6e\x63\x79\x5f\x6f\x74\x68\x65\x72\x5f\x30\x30\x32["\x27]''',
  '''\bidempotency_key\s*:\s*["\x27]\x69\x64\x65\x6d\x70\x6f\x74\x65\x6e\x63\x79\x5f\x69\x6e\x76\x61\x6c\x69\x64\x5f\x30\x30\x32["\x27]''',
  '''\bidempotency_key\s*:\s*["\x27]\x69\x64\x65\x6d\x70\x6f\x74\x65\x6e\x63\x79\x5f\x76\x32\x5f\x62\x5f\x69\x6e\x74\x65\x72\x72\x75\x70\x74\x65\x64\x5f\x30\x30\x32["\x27]''',
  '''\bidempotency_key\s*:\s*["\x27]\x69\x64\x65\x6d\x70\x6f\x74\x65\x6e\x63\x79\x5f\x74\x65\x73\x74\x5f\x30\x30\x31["\x27]'''
]

